<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Style Call</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-dark: #1c1c1d;
            --tg-blue: #3390ec;
            --tg-red: #ff3b30;
            --tg-gray: #8e8e93;
            --tg-glass: rgba(28, 28, 29, 0.75);
            --text-light: #ffffff;
            --text-dark: #000000;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: var(--tg-dark);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-light);
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        /* Видео элементы */
        #remote-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 10; display: none; background: #000;
        }
        
        #local-video {
            position: absolute; top: env(safe-area-inset-top, 40px); right: 20px;
            width: 100px; height: 150px; object-fit: cover; border-radius: 12px;
            z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1); display: none; background: #222;
        }

        .app-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            position: relative; z-index: 20; background: #ffffff; color: var(--text-dark);
            transition: background 0.3s;
        }
        
        .app-container.video-active { background: transparent; color: var(--text-light); }

        /* Стартовый экран */
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff; z-index: 300; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; text-align: center;
        }

        .main-icon { width: 80px; height: 80px; background: var(--tg-blue); border-radius: 20px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; color: white; box-shadow: 0 10px 20px rgba(51, 144, 236, 0.3); }
        .main-icon svg { width: 40px; height: 40px; fill: currentColor; }

        #start-app-btn {
            padding: 16px 40px; background-color: var(--tg-blue); color: white;
            border: none; border-radius: 30px; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: 0.2s; margin-top: 20px; width: 100%; max-width: 300px;
        }
        #start-app-btn:active { transform: scale(0.95); }

        /* Инфо панель (до звонка) */
        .call-info-panel { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
        .video-active .call-info-panel { display: none; }

        #call-status-large { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        #host-panel { display: none; flex-direction: column; align-items: center; width: 100%; margin-top: 20px; }
        #share-link-input { width: 100%; max-width: 300px; padding: 14px; background: #f2f2f7; border: none; border-radius: 12px; margin-bottom: 15px; text-align: center; font-size: 15px; color: var(--tg-blue); outline: none; }
        #copy-link-btn { width: 100%; max-width: 300px; padding: 14px; background-color: #f2f2f7; color: var(--tg-blue); border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }

        /* Панель управления звонком (Telegram Style) */
        .controls-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            box-sizing: border-box; z-index: 100; display: none;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        .controls { display: flex; justify-content: space-between; align-items: center; max-width: 350px; margin: 0 auto; background: var(--tg-glass); backdrop-filter: blur(20px); border-radius: 30px; padding: 10px 20px; box-shadow: 0 4px 30px rgba(0,0,0,0.3); }

        .control-button { background: none; border: none; padding: 10px; color: white; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; }
        .control-button svg { width: 28px; height: 28px; fill: currentColor; margin-bottom: 5px; }
        .control-button span { font-size: 11px; font-weight: 500; }
        .control-button.off { color: var(--tg-gray); }

        #end-call-btn { background: var(--tg-red); border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; padding: 0; box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4); }
        #end-call-btn svg { margin: 0; width: 24px; height: 24px; }

        /* Чат (Шторка) */
        #chat-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75dvh;
            background: #ffffff; z-index: 200; border-top-left-radius: 20px; border-top-right-radius: 20px;
            display: flex; flex-direction: column; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: var(--text-dark); box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        }
        #chat-overlay.open { transform: translateY(0); }

        .chat-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; font-weight: 600; font-size: 18px; }
        .close-chat { background: #f2f2f7; color: var(--text-dark); border: none; border-radius: 15px; padding: 6px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }

        #chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #e5e5ea; }
        
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 75%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg.mine { background: var(--tg-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.theirs { background: white; color: black; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        .chat-input-area { padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); background: white; display: flex; align-items: center; gap: 10px; }
        #chat-input { flex-grow: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 25px; font-size: 15px; outline: none; background: #f2f2f7; }
        #send-btn { background: var(--tg-blue); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        #send-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Индикатор новых сообщений */
        .chat-badge { position: absolute; top: 5px; right: 10px; background: var(--tg-red); width: 10px; height: 10px; border-radius: 50%; display: none; }
        .has-new-msg .chat-badge { display: block; }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" muted autoplay playsinline></video>

    <div class="app-container" id="app-container">
        
        <div id="start-screen">
            <div class="main-icon">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
            </div>
            <h2 style="font-size: 28px; margin: 0 0 10px;">Video Call</h2>
            <p id="start-desc" style="color: var(--tg-gray); margin-bottom: 30px;">Разрешите доступ к камере и микрофону для связи.</p>
            <button id="start-app-btn">Продолжить</button>
        </div>

        <div class="call-info-panel">
            <div id="call-status-large">Подключение...</div>
            <div id="call-duration" style="color: var(--tg-gray); font-size: 16px; display: none;">00:00</div>
            
            <div id="host-panel">
                <p style="color: var(--tg-gray); margin-bottom: 10px;">Ожидание собеседника. Отправьте ссылку:</p>
                <input type="text" id="share-link-input" readonly>
                <button id="copy-link-btn" onclick="copyLink()">Скопировать ссылку</button>
            </div>
        </div>

        <div class="controls-wrapper" id="controls-wrapper">
            <div class="controls">
                <button class="control-button" id="video-btn">
                    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    <span>Камера</span>
                </button>
                <button class="control-button" id="mute-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/></svg>
                    <span>Микрофон</span>
                </button>
                <button class="control-button" id="chat-btn" style="position: relative;">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    <span>Чат</span>
                    <div class="chat-badge"></div>
                </button>
                <button class="control-button" id="end-call-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="chat-overlay">
        <div class="chat-header">
            <span>Сообщения</span>
            <button class="close-chat" id="close-chat-btn">Скрыть</button>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Введите сообщение...">
            <button id="send-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        const els = {
            appCont: document.getElementById('app-container'),
            startScreen: document.getElementById('start-screen'),
            startAppBtn: document.getElementById('start-app-btn'),
            statusLarge: document.getElementById('call-status-large'),
            duration: document.getElementById('call-duration'),
            hostPanel: document.getElementById('host-panel'),
            shareInput: document.getElementById('share-link-input'),
            controlsWrap: document.getElementById('controls-wrapper'),
            muteBtn: document.getElementById('mute-btn'),
            videoBtn: document.getElementById('video-btn'),
            chatBtn: document.getElementById('chat-btn'),
            endCallBtn: document.getElementById('end-call-btn'),
            remoteVideo: document.getElementById('remote-video'),
            localVideo: document.getElementById('local-video'),
            chatOverlay: document.getElementById('chat-overlay'),
            chatMsgs: document.getElementById('chat-messages'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            closeChatBtn: document.getElementById('close-chat-btn')
        };

        let localStream, currentPeer, currentMediaCall, currentDataConn;
        let callStartTime, durationInterval;
        let isMuted = false, isVideoOff = false;
        const targetId = new URLSearchParams(window.location.search).get('call');

        // Если перешли по ссылке, меняем текст кнопки
        if (targetId) els.startAppBtn.innerText = "Присоединиться к звонку";

        els.startAppBtn.addEventListener('click', async () => {
            els.startScreen.style.display = 'none';
            els.statusLarge.innerText = "Доступ к камере...";
            
            try {
                // Запрашиваем медиа
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                els.localVideo.srcObject = localStream;
                els.localVideo.play().catch(e => console.log(e));
                
                els.statusLarge.innerText = "Связь с сервером...";
                initPeer();
            } catch (err) {
                els.statusLarge.innerText = "Ошибка камеры/микрофона";
                alert("Пожалуйста, разрешите доступ к камере и микрофону в настройках браузера.");
            }
        });

        function initPeer() {
            currentPeer = new Peer();
            
            currentPeer.on('open', myId => {
                if (targetId) {
                    els.statusLarge.innerText = "Соединение...";
                    // Мы присоединяемся - звоним и открываем чат-канал
                    const call = currentPeer.call(targetId, localStream);
                    handleMediaCall(call);
                    
                    const conn = currentPeer.connect(targetId);
                    setupDataConn(conn);
                } else {
                    els.statusLarge.innerText = "Готово";
                    els.shareInput.value = `${window.location.origin}${window.location.pathname}?call=${myId}`;
                    els.hostPanel.style.display = 'flex';
                }
            });

            // Если звонят НАМ
            currentPeer.on('call', call => {
                call.answer(localStream);
                handleMediaCall(call);
                els.hostPanel.style.display = 'none';
            });

            // Если подключаются к НАШЕМУ чату
            currentPeer.on('connection', conn => {
                setupDataConn(conn);
            });
        }

        // --- Обработка Видео ---
        function handleMediaCall(call) {
            currentMediaCall = call;
            els.statusLarge.innerText = "Разговор установлен";
            els.duration.style.display = 'block';
            
            callStartTime = Date.now();
            durationInterval = setInterval(updateDuration, 1000);

            call.on('stream', remoteStream => {
                // Защита от двойного срабатывания события в PeerJS
                if (els.remoteVideo.srcObject !== remoteStream) {
                    els.remoteVideo.srcObject = remoteStream;
                    
                    // Переключаем интерфейс на "Видео режим"
                    els.appCont.classList.add('video-active');
                    els.remoteVideo.style.display = 'block';
                    els.localVideo.style.display = 'block';
                    els.controlsWrap.style.display = 'block';
                    
                    // Принудительный старт для мобилок
                    els.remoteVideo.play().catch(e => console.error("Video play error:", e));
                }
            });

            call.on('close', endCallUI);
        }

        // --- Обработка Чата ---
        function setupDataConn(conn) {
            conn.on('open', () => {
                currentDataConn = conn; // Сохраняем глобально только когда канал открыт
            });
            
            conn.on('data', data => {
                if(data.type === 'chat') {
                    addMsg(data.msg, false);
                }
            });
        }

        // --- Кнопки Управления ---
        els.muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if(localStream) localStream.getAudioTracks()[0].enabled = !isMuted;
            els.muteBtn.classList.toggle('off', isMuted);
        });

        els.videoBtn.addEventListener('click', () => {
            isVideoOff = !isVideoOff;
            if(localStream) localStream.getVideoTracks()[0].enabled = !isVideoOff;
            els.videoBtn.classList.toggle('off', isVideoOff);
            els.localVideo.style.opacity = isVideoOff ? '0' : '1';
        });

        els.endCallBtn.addEventListener('click', () => {
            if (currentMediaCall) currentMediaCall.close();
            if (currentDataConn) currentDataConn.close();
            if (currentPeer) currentPeer.destroy();
            endCallUI();
        });

        function updateDuration() {
            const d = Date.now() - callStartTime;
            const m = Math.floor(d / 60000).toString().padStart(2, '0');
            const s = Math.floor((d % 60000) / 1000).toString().padStart(2, '0');
            els.duration.innerText = `${m}:${s}`;
        }

        function endCallUI() {
            clearInterval(durationInterval);
            els.controlsWrap.style.display = 'none';
            els.remoteVideo.style.display = 'none';
            els.localVideo.style.display = 'none';
            els.appCont.classList.remove('video-active');
            els.statusLarge.innerText = "Звонок завершен";
            els.duration.style.display = 'none';
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        function copyLink() {
            els.shareInput.select();
            navigator.clipboard.writeText(els.shareInput.value).then(() => alert("Ссылка скопирована!"));
        }

        // --- Логика UI Чата ---
        els.chatBtn.addEventListener('click', () => {
            els.chatOverlay.classList.add('open');
            els.chatBtn.classList.remove('has-new-msg'); // Убираем бейдж
        });
        
        els.closeChatBtn.addEventListener('click', () => {
            els.chatOverlay.classList.remove('open');
        });

        function sendMsg() {
            const txt = els.chatInput.value.trim();
            if(!txt || !currentDataConn) return;
            
            currentDataConn.send({ type: 'chat', msg: txt });
            addMsg(txt, true);
            els.chatInput.value = '';
        }

        els.sendBtn.addEventListener('click', sendMsg);
        els.chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMsg(); });

        function addMsg(txt, isMine) {
            const div = document.createElement('div');
            div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
            div.innerText = txt;
            els.chatMsgs.appendChild(div);
            els.chatMsgs.scrollTop = els.chatMsgs.scrollHeight;
            
            // Если пришло сообщение, а чат закрыт - показываем красную точку
            if(!isMine && !els.chatOverlay.classList.contains('open')) {
                els.chatBtn.classList.add('has-new-msg');
            }
        }
    </script>
</body>
</html>
