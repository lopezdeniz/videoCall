<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Call & Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-white: #FFFFFF;
            --apple-gray-light: #F2F2F7;
            --apple-gray: #8E8E93;
            --apple-gray-dark: #3A3A3C;
            --apple-blue: #007AFF;
            --apple-green: #34C759;
            --apple-red: #FF3B30;
            --apple-text-dark: #000000;
            --apple-text-light: #F2F2F7;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: var(--apple-text-dark); /* Темный фон для видео */
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            color: var(--apple-text-dark);
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        /* Видео элементы */
        #remote-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 10; display: none; background: #111;
        }
        
        #local-video {
            position: absolute; top: env(safe-area-inset-top, 50px); right: 20px;
            width: 110px; height: 160px; object-fit: cover; border-radius: 16px;
            z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2); display: none; background: #333;
            transform: translateY(50px); /* Смещение под статус-бар */
        }

        .app-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            position: relative; z-index: 20; background: var(--apple-gray-light);
            transition: background 0.3s;
        }
        
        .app-container.video-active { background: transparent; }

        /* Стартовый экран */
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--apple-white); z-index: 300; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center; box-sizing: border-box;
        }

        #start-app-btn {
            padding: 16px 40px; background-color: var(--apple-blue); color: white;
            border: none; border-radius: 30px; font-size: 18px; font-weight: 600;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); margin-top: 20px;
        }

        .status-bar {
            height: 60px; padding: env(safe-area-inset-top, 10px) 20px 0;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; font-weight: 500; z-index: 100; position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent); color: white;
        }
        .status-bar.light-mode { background: transparent; color: black; }

        .call-info-panel {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .video-active .call-info-panel { display: none; }

        #call-status-large { font-size: 28px; font-weight: 600; margin-bottom: 5px; }
        
        #host-panel { display: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; box-sizing: border-box; }
        #host-link-card { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        #share-link-input { width: 100%; padding: 12px; background: var(--apple-gray-light); border: none; border-radius: 10px; margin: 15px 0; box-sizing: border-box; text-align: center; font-size: 14px; color: var(--apple-blue); outline: none; }
        #copy-link-btn { width: 100%; padding: 14px; background-color: var(--apple-blue); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; }

        /* Панель управления */
        .controls-wrapper {
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            width: 100%; box-sizing: border-box; flex-shrink: 0; z-index: 100;
        }
        
        .video-active .controls-wrapper {
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        }

        .controls { display: flex; flex-direction: column; align-items: center; width: 100%; }

        .buttons-grid {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; width: 100%;
        }

        .control-button { display: flex; flex-direction: column; align-items: center; background: none; border: none; padding: 0; }
        .icon-circle {
            width: 60px; height: 60px; border-radius: 50%; background-color: var(--apple-gray-dark);
            color: white; display: flex; justify-content: center; align-items: center;
            margin-bottom: 8px; transition: 0.2s; backdrop-filter: blur(10px);
        }
        .video-active .icon-circle { background-color: rgba(255,255,255,0.2); }
        
        .control-button.active .icon-circle { background-color: var(--apple-white); color: var(--apple-gray-dark); }
        .control-button span { font-size: 12px; color: var(--apple-gray); font-weight: 500; }
        .video-active .control-button span { color: white; }

        #end-call-btn { width: 75px; height: 75px; border-radius: 50%; background-color: var(--apple-red); color: white; border: none; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4); }

        .icon { width: 28px; height: 28px; fill: currentColor; }

        /* Чат */
        #chat-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75dvh;
            background: rgba(242, 242, 247, 0.95); backdrop-filter: blur(20px);
            z-index: 200; border-top-left-radius: 24px; border-top-right-radius: 24px;
            display: flex; flex-direction: column; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); border-top: 1px solid var(--glass-border);
        }
        #chat-overlay.open { transform: translateY(0); }

        .chat-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.1); font-weight: 600; font-size: 18px;
        }
        .close-chat { background: var(--apple-gray); color: white; border: none; border-radius: 15px; padding: 5px 12px; font-size: 13px; font-weight: 600; }

        #chat-messages {
            flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
        }
        
        .msg { padding: 10px 16px; border-radius: 20px; max-width: 75%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg.mine { background: var(--apple-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.theirs { background: white; color: black; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .chat-input-area {
            padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
            background: white; border-top: 1px solid rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 10px;
        }
        #chat-input {
            flex-grow: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 20px;
            font-size: 15px; outline: none; font-family: inherit; background: var(--apple-gray-light);
        }
        #send-btn {
            background: var(--apple-blue); color: white; border: none; border-radius: 50%;
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        #language-panel-start { display: flex; gap: 10px; margin-top: 30px; }
        .lang-button { padding: 8px 16px; background: var(--apple-gray-light); color: var(--apple-gray-dark); border: none; border-radius: 20px; font-weight: 600; }
        .lang-button.active { background: var(--apple-green); color: white; }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" muted autoplay playsinline></video>

    <div class="app-container" id="app-container">
        
        <div id="start-screen">
            <h2 style="font-size: 32px; margin-bottom: 10px;">Voice & Video</h2>
            <p id="start-desc" style="color: var(--apple-gray); margin-bottom: 10px; padding: 0 20px;">Для работы требуются камера и микрофон.</p>
            <button id="start-app-btn">Начать</button>
            <div id="language-panel-start">
                <button class="lang-button active" onclick="setLanguage('RU')">RU</button>
                <button class="lang-button" onclick="setLanguage('EN')">EN</button>
            </div>
        </div>

        <div class="status-bar light-mode" id="status-bar">
            <span id="call-duration-top">00:00</span>
        </div>

        <div class="call-info-panel">
            <div id="call-status-large">Подключение...</div>
            <div id="call-status-description" style="font-size: 15px; color: var(--apple-gray); margin-top: 5px;"></div>
            
            <div id="host-panel">
                <div id="host-link-card">
                    <p id="host-title" style="margin: 0; font-weight: 600; color: var(--apple-gray-dark);">Пригласите собеседника:</p>
                    <input type="text" id="share-link-input" readonly>
                    <button id="copy-link-btn" onclick="copyLink()">Скопировать ссылку</button>
                </div>
            </div>
        </div>

        <div class="controls-wrapper" id="controls-wrapper" style="display: none;">
            <div class="controls">
                <div class="buttons-grid">
                    <button class="control-button" id="mute-btn">
                        <div class="icon-circle">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                        </div>
                        <span id="mute-label">Микрофон</span>
                    </button>
                    <button class="control-button" id="video-btn">
                        <div class="icon-circle">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                        </div>
                        <span id="video-label">Камера</span>
                    </button>
                    <button class="control-button" id="chat-btn">
                        <div class="icon-circle">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                        </div>
                        <span id="chat-label">Чат</span>
                    </button>
                    <button class="control-button speaker" id="speaker-btn">
                        <div class="icon-circle">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </div>
                        <span id="speaker-label">Динамик</span>
                    </button>
                </div>
                <button id="end-call-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="chat-overlay">
        <div class="chat-header">
            <span id="chat-title">Чат</span>
            <button class="close-chat" id="close-chat-btn">Закрыть</button>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Сообщение...">
            <button id="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        const uiStrings = {
            RU: { startDesc: "Для работы требуются камера и микрофон.", btnStart: "Начать", mediaReq: "Запрос доступа...", mediaError: "Ошибка камеры/микрофона.", serverConnect: "Подключение...", hostWaiting: "Отправьте ссылку:", hostCopy: "Скопировать", autoConnect: "Соединение...", activeCall: "Разговор", callEnd: "Завершен", chatTitle: "Чат", chatPlaceholder: "Сообщение...", close: "Закрыть" },
            EN: { startDesc: "Camera and microphone access required.", btnStart: "Start", mediaReq: "Requesting access...", mediaError: "Camera/Mic error.", serverConnect: "Connecting...", hostWaiting: "Share link:", hostCopy: "Copy", autoConnect: "Connecting...", activeCall: "Call Active", callEnd: "Ended", chatTitle: "Chat", chatPlaceholder: "Message...", close: "Close" }
        };

        const els = {
            appCont: document.getElementById('app-container'),
            statusBar: document.getElementById('status-bar'),
            startScreen: document.getElementById('start-screen'),
            startAppBtn: document.getElementById('start-app-btn'),
            statusLarge: document.getElementById('call-status-large'),
            statusDesc: document.getElementById('call-status-description'),
            durationTop: document.getElementById('call-duration-top'),
            hostPanel: document.getElementById('host-panel'),
            shareInput: document.getElementById('share-link-input'),
            controlsWrap: document.getElementById('controls-wrapper'),
            muteBtn: document.getElementById('mute-btn'),
            videoBtn: document.getElementById('video-btn'),
            chatBtn: document.getElementById('chat-btn'),
            speakerBtn: document.getElementById('speaker-btn'),
            endCallBtn: document.getElementById('end-call-btn'),
            remoteVideo: document.getElementById('remote-video'),
            localVideo: document.getElementById('local-video'),
            chatOverlay: document.getElementById('chat-overlay'),
            chatMsgs: document.getElementById('chat-messages'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            closeChatBtn: document.getElementById('close-chat-btn')
        };

        let localStream, currentPeer, currentMediaCall, currentDataConn;
        let callStartTime, durationInterval, wakeLock = null;
        let isMuted = false, isVideoOff = true, isSpeaker = false;

        const targetId = new URLSearchParams(window.location.search).get('call');
        let lang = 'RU';

        function setLanguage(l) {
            lang = l;
            document.querySelectorAll('.lang-button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-button[onclick="setLanguage('${l}')"]`).classList.add('active');
            updateUI();
        }

        function updateUI() {
            const s = uiStrings[lang];
            document.getElementById('start-desc').innerText = s.startDesc;
            els.startAppBtn.innerText = targetId && !currentMediaCall ? (lang==='RU'?"Присоединиться":"Join") : s.btnStart;
            document.getElementById('host-title').innerText = s.hostWaiting;
            document.getElementById('copy-link-btn').innerText = s.hostCopy;
            document.getElementById('chat-title').innerText = s.chatTitle;
            els.chatInput.placeholder = s.chatPlaceholder;
            els.closeChatBtn.innerText = s.close;
        }
        updateUI();

        async function getMedia() {
            try {
                return await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            } catch (err) {
                console.warn("Video fail, trying audio only");
                return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            }
        }

        els.startAppBtn.addEventListener('click', async () => {
            els.startScreen.style.display = 'none';
            els.statusDesc.innerText = uiStrings[lang].mediaReq;
            
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}

            try {
                localStream = await getMedia();
                // По умолчанию отключаем видео, чтобы включить кнопкой
                if(localStream.getVideoTracks().length > 0) {
                    localStream.getVideoTracks()[0].enabled = false;
                }
                els.localVideo.srcObject = localStream;
                els.statusDesc.innerText = uiStrings[lang].serverConnect;
                initPeer();
            } catch (err) {
                els.statusLarge.innerText = "Ошибка";
                els.statusDesc.innerText = uiStrings[lang].mediaError;
            }
        });

        function initPeer() {
            currentPeer = new Peer();
            
            currentPeer.on('open', myId => {
                if (targetId) {
                    els.statusLarge.innerText = uiStrings[lang].autoConnect;
                    currentDataConn = currentPeer.connect(targetId);
                    setupDataConn(currentDataConn);
                    handleMediaCall(currentPeer.call(targetId, localStream));
                } else {
                    els.statusLarge.innerText = uiStrings[lang].hostWaiting;
                    els.shareInput.value = `${window.location.origin}${window.location.pathname}?call=${myId}`;
                    els.hostPanel.style.display = 'flex';
                }
            });

            currentPeer.on('call', call => {
                call.answer(localStream);
                handleMediaCall(call);
                els.hostPanel.style.display = 'none';
            });

            currentPeer.on('connection', conn => {
                currentDataConn = conn;
                setupDataConn(conn);
            });
        }

        function handleMediaCall(call) {
            currentMediaCall = call;
            els.controlsWrap.style.display = 'block';
            els.statusLarge.innerText = uiStrings[lang].activeCall;
            els.statusDesc.innerText = "";
            els.durationTop.style.display = 'block';
            
            callStartTime = Date.now();
            durationInterval = setInterval(updateDuration, 1000);

            call.on('stream', remoteStream => {
                els.remoteVideo.srcObject = remoteStream;
                els.appCont.classList.add('video-active');
                els.statusBar.classList.remove('light-mode');
                els.remoteVideo.style.display = 'block';
                els.localVideo.style.display = 'block';
                setSpeaker(isSpeaker);
                // Проверяем наличие видео трека
                els.videoBtn.classList.toggle('active', isVideoOff);
            });

            call.on('close', endCallUI);
        }

        function setupDataConn(conn) {
            conn.on('data', data => {
                if(data.type === 'chat') addMsg(data.msg, false);
            });
        }

        // --- Управление ---
        els.muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if(localStream && localStream.getAudioTracks()[0]) localStream.getAudioTracks()[0].enabled = !isMuted;
            els.muteBtn.classList.toggle('active', isMuted);
        });

        els.videoBtn.addEventListener('click', () => {
            if(localStream && localStream.getVideoTracks().length > 0) {
                isVideoOff = !isVideoOff;
                localStream.getVideoTracks()[0].enabled = !isVideoOff;
                els.videoBtn.classList.toggle('active', isVideoOff);
            } else {
                alert("Камера не найдена");
            }
        });

        els.speakerBtn.addEventListener('click', () => {
            isSpeaker = !isSpeaker;
            setSpeaker(isSpeaker);
            els.speakerBtn.classList.toggle('active', isSpeaker);
        });

        function setSpeaker(speaker) {
            // На мобильных браузерах жесткий контроль динамиков ограничен.
            // Громкая связь симулируется максимальной громкостью
            els.remoteVideo.volume = speaker ? 1 : 0.2; 
        }

        els.endCallBtn.addEventListener('click', () => {
            if (currentMediaCall) currentMediaCall.close();
            if (currentDataConn) currentDataConn.close();
            if (currentPeer) currentPeer.destroy();
            endCallUI();
        });

        function updateDuration() {
            const d = Date.now() - callStartTime;
            const m = Math.floor(d / 60000).toString().padStart(2, '0');
            const s = Math.floor((d % 60000) / 1000).toString().padStart(2, '0');
            els.durationTop.innerText = `${m}:${s}`;
        }

        function endCallUI() {
            els.controlsWrap.style.display = 'none';
            clearInterval(durationInterval);
            els.statusLarge.innerText = uiStrings[lang].callEnd;
            els.durationTop.style.display = 'none';
            els.remoteVideo.style.display = 'none';
            els.localVideo.style.display = 'none';
            els.appCont.classList.remove('video-active');
            els.statusBar.classList.add('light-mode');
            window.history.replaceState({}, document.title, window.location.pathname);
            if (wakeLock) wakeLock.release().then(() => wakeLock = null);
        }

        function copyLink() {
            els.shareInput.select();
            navigator.clipboard.writeText(els.shareInput.value).then(() => alert(uiStrings[lang].hostCopy + " ✓"));
        }

        // --- Чат Логика ---
        els.chatBtn.addEventListener('click', () => els.chatOverlay.classList.add('open'));
        els.closeChatBtn.addEventListener('click', () => els.chatOverlay.classList.remove('open'));

        function sendMsg() {
            const txt = els.chatInput.value.trim();
            if(!txt || !currentDataConn) return;
            currentDataConn.send({ type: 'chat', msg: txt });
            addMsg(txt, true);
            els.chatInput.value = '';
        }

        els.sendBtn.addEventListener('click', sendMsg);
        els.chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMsg(); });

        function addMsg(txt, isMine) {
            const div = document.createElement('div');
            div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
            div.innerText = txt;
            els.chatMsgs.appendChild(div);
            els.chatMsgs.scrollTop = els.chatMsgs.scrollHeight;
            if(!isMine && !els.chatOverlay.classList.contains('open')) {
                els.chatBtn.classList.add('active');
                setTimeout(() => els.chatBtn.classList.remove('active'), 2000); // Индикатор
            }
        }
    </script>
</body>
</html>
